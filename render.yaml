# Render Blueprint: creates the web app + a free PostgreSQL database in one click
databases:
  - name: stockflow-db
    plan: free
    databaseName: stockflow
    user: stockflow

services:
  - type: web
    name: stockflow
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python -m gunicorn stockflow.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: 2
