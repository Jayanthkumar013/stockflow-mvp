{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
{% include "_auth_card.html" %}
<div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h2 class="mb-6 text-xl font-semibold">Create your account</h2>
  <form method="post" class="space-y-4" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <button class="w-full rounded-lg bg-indigo-600 py-2.5 font-medium text-white hover:bg-indigo-700">Sign up</button>
  </form>
  <p class="mt-6 text-center text-sm text-slate-500">Already have an account? <a href="{% url 'login' %}" class="font-medium text-indigo-600 hover:underline">Log in</a></p>
</div>
{% endblock %}
