{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <h1 class="mb-6 text-2xl font-bold">Settings</h1>
  <form method="post" class="space-y-4 rounded-2xl border border-slate-200 bg-white p-8" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <p class="text-sm text-slate-500">Products without their own low stock threshold use this default.</p>
    <button class="rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white hover:bg-indigo-700">Save settings</button>
  </form>
</div>
{% endblock %}
